[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "giuggiai-meter"
version = "0.2.1"
description = "LLM cost control for apps and agents: per-call usage, budgets before the call, subscription plans, cost per accepted result, forecasts and monthly reconciliation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GiuggiAI", email = "oss@giuggiai.com"}]
keywords = ["llm", "ai", "cost", "tokens", "finops", "budget", "agents", "openai", "anthropic", "gemini", "deepseek", "grok", "qwen"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]

[project.scripts]
giuggiai-meter = "giuggiai_meter.__main__:main"

[project.urls]
Homepage = "https://github.com/giuggiai/giuggiai-meter"
Source = "https://github.com/giuggiai/giuggiai-meter"
Issues = "https://github.com/giuggiai/giuggiai-meter/issues"
Documentation = "https://giuggiai.github.io/giuggiai-meter/"
Changelog = "https://github.com/giuggiai/giuggiai-meter/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["giuggiai_meter", "giuggiai_meter.data"]

[tool.setuptools.package-data]
"giuggiai_meter.data" = ["*.json"]

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
