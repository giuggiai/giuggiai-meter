[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giuggiai-meter"
version = "0.1.0"
description = "Per-call LLM usage logging, per-project cost reports and monthly reconciliation with provider bills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
giuggiai-meter = "giuggiai_meter.__main__:main"

[project.urls]
Homepage = "https://github.com/giuggiai/giuggiai-meter"

[tool.setuptools]
packages = ["giuggiai_meter"]

[tool.setuptools.package-data]
giuggiai_meter = ["data/*.json"]

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
testpaths = ["tests"]
