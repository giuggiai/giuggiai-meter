name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, expected and actual result. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version"
